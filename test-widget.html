<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Widget - Inti Para Travel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #dc2626;
            margin-bottom: 10px;
        }
        .tagline {
            color: #64748b;
            font-size: 1.1rem;
        }
        .widget-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .section-title {
            font-size: 1.5rem;
            color: #1e293b;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #dc2626;
        }
        .debug-panel {
            margin-top: 40px;
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            font-family: monospace;
        }
        .debug-panel h3 {
            color: #60a5fa;
            margin-bottom: 15px;
        }
        .debug-panel pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .test-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .test-btn {
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .test-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🏔️ Inti Para Travel</div>
            <p class="tagline">Los mejores tours de San Pedro de Atacama</p>
        </header>

        <div class="widget-container">
            <h2 class="section-title">Nuestros Tours</h2>

            <!-- WIDGET DE RESERVAS -->
            <div id="booking-widget" data-agency="inti-para"></div>
        </div>

        <div class="debug-panel">
            <h3>🔧 Panel de Debug</h3>
            <div class="test-buttons">
                <button class="test-btn" onclick="testAPI('agencies')">Test: Listar Agencias</button>
                <button class="test-btn" onclick="testAPI('agency')">Test: Info Inti Para</button>
                <button class="test-btn" onclick="testAPI('products')">Test: Productos</button>
                <button class="test-btn" onclick="testAPI('bookings')">Test: Reservas</button>
            </div>
            <pre id="debug-output">Haz clic en un botón para probar la API...</pre>
        </div>
    </div>

    <!-- Widget Script -->
    <script src="/widgets/agency-booking-widget.js"></script>

    <script>
        const API_BASE = '/api';

        async function testAPI(endpoint) {
            const output = document.getElementById('debug-output');
            output.textContent = 'Cargando...';

            let url;
            switch(endpoint) {
                case 'agencies':
                    url = `${API_BASE}/agencies`;
                    break;
                case 'agency':
                    url = `${API_BASE}/agencies/inti-para`;
                    break;
                case 'products':
                    url = `${API_BASE}/agencies/inti-para/products`;
                    break;
                case 'bookings':
                    url = `${API_BASE}/agencies/inti-para/bookings?limit=5`;
                    break;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                output.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                output.textContent = `Error: ${error.message}`;
            }
        }

        // Log widget initialization
        console.log('Test page loaded. Widget should initialize automatically.');
    </script>
</body>
</html>
