<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Administración - Reservas | Atacama Dark Sky</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(96, 165, 250, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(96, 165, 250, 0.2);
        }

        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #60a5fa;
        }

        .filters-section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="text"], input[type="date"] {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(96, 165, 250, 0.3);
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(71, 85, 105, 0.5);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 0.8);
        }

        .bookings-table-container {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(96, 165, 250, 0.2);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead {
            background: rgba(15, 23, 42, 0.6);
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #60a5fa;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border-bottom: 2px solid rgba(96, 165, 250, 0.3);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }

        tbody tr {
            transition: background 0.3s;
        }

        tbody tr:hover {
            background: rgba(96, 165, 250, 0.05);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
        }

        .status-confirmed {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-pending {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-completed {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .tour-type-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
        }

        .tour-regular {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .tour-private {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .tour-astrophoto {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: #60a5fa;
        }

        .loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 15px;
            min-width: 40px;
        }

        .pagination .active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .booking-details {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 5px;
        }

        .btn-icon {
            padding: 8px 12px;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1><i class="fas fa-telescope"></i> Portal de Administración</h1>
                <p class="subtitle">Sistema de gestión de reservas - Atacama Dark Sky</p>
            </div>
            <button onclick="logout()" style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 500;">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </header>

        <div id="errorContainer"></div>

        <div class="stats-container" id="statsContainer">
            <div class="stat-card">
                <div class="stat-label">Total Reservas</div>
                <div class="stat-value" id="statTotal">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Confirmadas</div>
                <div class="stat-value" id="statConfirmed" style="color: #4ade80;">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Pendientes</div>
                <div class="stat-value" id="statPending" style="color: #fbbf24;">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Personas</div>
                <div class="stat-value" id="statPersons" style="color: #60a5fa;">-</div>
            </div>
        </div>

        <div class="filters-section">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="filterStatus">Estado</label>
                    <select id="filterStatus">
                        <option value="">Todos</option>
                        <option value="confirmed">Confirmado</option>
                        <option value="pending">Pendiente</option>
                        <option value="cancelled">Cancelado</option>
                        <option value="completed">Completado</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterTourType">Tipo de Tour</label>
                    <select id="filterTourType">
                        <option value="">Todos</option>
                        <option value="regular">Regular</option>
                        <option value="private">Privado</option>
                        <option value="astrophoto">Astrofotografía</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDateFrom">Fecha Desde</label>
                    <input type="date" id="filterDateFrom">
                </div>
                <div class="filter-group">
                    <label for="filterDateTo">Fecha Hasta</label>
                    <input type="date" id="filterDateTo">
                </div>
                <div class="filter-group">
                    <label for="filterSearch">Buscar</label>
                    <input type="text" id="filterSearch" placeholder="Nombre, email, teléfono...">
                </div>
                <div class="filter-group">
                    <label for="filterSort">Ordenar por</label>
                    <select id="filterSort">
                        <option value="date_desc">Fecha tour (más reciente)</option>
                        <option value="date_asc">Fecha tour (más antigua)</option>
                        <option value="created_desc">Creación (más reciente)</option>
                        <option value="created_asc">Creación (más antigua)</option>
                        <option value="name_asc">Nombre (A-Z)</option>
                        <option value="name_desc">Nombre (Z-A)</option>
                    </select>
                </div>
            </div>
            <div class="filter-buttons">
                <button class="btn-primary" onclick="applyFilters()">
                    <i class="fas fa-filter"></i> Aplicar Filtros
                </button>
                <button class="btn-secondary" onclick="clearFilters()">
                    <i class="fas fa-times"></i> Limpiar
                </button>
                <button class="btn-secondary" onclick="exportData()">
                    <i class="fas fa-download"></i> Exportar CSV
                </button>
            </div>
        </div>

        <div class="bookings-table-container">
            <div id="loadingIndicator" class="loading">
                <i class="fas fa-spinner"></i> Cargando reservas...
            </div>

            <div id="bookingsContent" style="display: none;">
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>ID Reserva</th>
                            <th>Fecha Tour</th>
                            <th>Cliente</th>
                            <th>Contacto</th>
                            <th>Tour</th>
                            <th>Personas</th>
                            <th>Estado</th>
                            <th>Origen</th>
                            <th>Creada</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                    </tbody>
                </table>

                <div class="pagination" id="paginationContainer"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let currentFilters = {};
        let allBookings = [];

        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuthentication();
            if (!isAuthenticated) {
                window.location.href = '/admin-login.html';
                return;
            }
            loadBookings();
        });

        // Check if user is authenticated
        async function checkAuthentication() {
            try {
                const response = await fetch('/api/auth-session');
                const session = await response.json();

                if (!session || !session.user) {
                    return false;
                }

                return true;
            } catch (error) {
                console.error('Auth check error:', error);
                return false;
            }
        }

        async function loadBookings(page = 1) {
            try {
                document.getElementById('loadingIndicator').style.display = 'block';
                document.getElementById('bookingsContent').style.display = 'none';
                document.getElementById('errorContainer').innerHTML = '';

                const params = new URLSearchParams({
                    page: page,
                    limit: 50,
                    ...currentFilters
                });

                const response = await fetch(`/api/bookings?${params}`);

                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Error al cargar las reservas');
                }

                allBookings = data.data.bookings;
                renderStats(data.data.stats);
                renderBookings(data.data.bookings);
                renderPagination(data.data.pagination);

                currentPage = page;

                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('bookingsContent').style.display = 'block';

            } catch (error) {
                console.error('Error loading bookings:', error);
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('errorContainer').innerHTML = `
                    <div class="error">
                        <strong><i class="fas fa-exclamation-triangle"></i> Error:</strong> ${error.message}
                    </div>
                `;
            }
        }

        function renderStats(stats) {
            document.getElementById('statTotal').textContent = stats.total_bookings || 0;
            document.getElementById('statConfirmed').textContent = stats.confirmed || 0;
            document.getElementById('statPending').textContent = stats.pending || 0;
            document.getElementById('statPersons').textContent = stats.total_persons || 0;
        }

        function renderBookings(bookings) {
            const tbody = document.getElementById('bookingsTableBody');

            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px; color: #94a3b8;">No se encontraron reservas con los filtros aplicados.</td></tr>';
                return;
            }

            tbody.innerHTML = bookings.map(booking => `
                <tr>
                    <td><strong>${booking.booking_id}</strong></td>
                    <td>
                        <strong>${formatDate(booking.date)}</strong>
                        <div class="booking-details">${booking.time || 'Sin horario'}</div>
                    </td>
                    <td>
                        <strong>${booking.name}</strong>
                        ${booking.accommodation ? `<div class="booking-details">${booking.accommodation}</div>` : ''}
                    </td>
                    <td>
                        <div style="font-size: 0.85rem;">
                            <div><i class="fas fa-envelope"></i> ${booking.email}</div>
                            <div><i class="fas fa-phone"></i> ${booking.phone}</div>
                        </div>
                    </td>
                    <td>
                        <span class="tour-type-badge tour-${booking.tour_type}">
                            ${getTourTypeName(booking.tour_type)}
                        </span>
                    </td>
                    <td><strong>${booking.persons}</strong></td>
                    <td>
                        <span class="status-badge status-${booking.status}">
                            ${getStatusName(booking.status)}
                        </span>
                        ${booking.reminder_sent ? '<div class="booking-details"><i class="fas fa-bell"></i> Recordatorio enviado</div>' : ''}
                    </td>
                    <td><span style="font-size: 0.85rem;">${booking.source || 'web'}</span></td>
                    <td>
                        <div style="font-size: 0.85rem;">
                            ${formatDateTime(booking.created_at)}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(pagination) {
            const container = document.getElementById('paginationContainer');

            if (pagination.totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '<button class="btn-secondary" onclick="loadBookings(1)" ' +
                       (pagination.page === 1 ? 'disabled' : '') + '><i class="fas fa-angle-double-left"></i></button>';

            html += '<button class="btn-secondary" onclick="loadBookings(' + (pagination.page - 1) + ')" ' +
                    (pagination.page === 1 ? 'disabled' : '') + '><i class="fas fa-angle-left"></i></button>';

            const maxButtons = 5;
            let startPage = Math.max(1, pagination.page - Math.floor(maxButtons / 2));
            let endPage = Math.min(pagination.totalPages, startPage + maxButtons - 1);

            if (endPage - startPage + 1 < maxButtons) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="btn-secondary ${i === pagination.page ? 'active' : ''}"
                         onclick="loadBookings(${i})">${i}</button>`;
            }

            html += '<button class="btn-secondary" onclick="loadBookings(' + (pagination.page + 1) + ')" ' +
                    (pagination.page === pagination.totalPages ? 'disabled' : '') + '><i class="fas fa-angle-right"></i></button>';

            html += '<button class="btn-secondary" onclick="loadBookings(' + pagination.totalPages + ')" ' +
                    (pagination.page === pagination.totalPages ? 'disabled' : '') + '><i class="fas fa-angle-double-right"></i></button>';

            html += `<span style="color: #94a3b8; margin-left: 15px;">
                     Página ${pagination.page} de ${pagination.totalPages} (${pagination.total} reservas)
                     </span>`;

            container.innerHTML = html;
        }

        function applyFilters() {
            currentFilters = {};

            const status = document.getElementById('filterStatus').value;
            const tourType = document.getElementById('filterTourType').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;
            const search = document.getElementById('filterSearch').value;
            const sort = document.getElementById('filterSort').value;

            if (status) currentFilters.status = status;
            if (tourType) currentFilters.tour_type = tourType;
            if (dateFrom) currentFilters.date_from = dateFrom;
            if (dateTo) currentFilters.date_to = dateTo;
            if (search) currentFilters.search = search;
            if (sort) currentFilters.sort = sort;

            loadBookings(1);
        }

        function clearFilters() {
            document.getElementById('filterStatus').value = '';
            document.getElementById('filterTourType').value = '';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.getElementById('filterSearch').value = '';
            document.getElementById('filterSort').value = 'date_desc';

            currentFilters = {};
            loadBookings(1);
        }

        function exportData() {
            if (allBookings.length === 0) {
                alert('No hay reservas para exportar');
                return;
            }

            const csv = convertToCSV(allBookings);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            link.setAttribute('href', url);
            link.setAttribute('download', `reservas_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function convertToCSV(data) {
            const headers = ['ID Reserva', 'Fecha Tour', 'Hora', 'Tipo Tour', 'Nombre', 'Email',
                           'Teléfono', 'Personas', 'Estado', 'Alojamiento', 'Mensaje', 'Origen',
                           'Recordatorio Enviado', 'Fecha Creación'];

            const rows = data.map(booking => [
                booking.booking_id,
                booking.date,
                booking.time || '',
                booking.tour_type,
                booking.name,
                booking.email,
                booking.phone,
                booking.persons,
                booking.status,
                booking.accommodation || '',
                booking.message || '',
                booking.source || 'web',
                booking.reminder_sent ? 'Sí' : 'No',
                booking.created_at
            ]);

            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');

            return '\uFEFF' + csvContent; // BOM for Excel UTF-8
        }

        // Helper functions
        function formatDate(dateString) {
            if (!dateString) return 'Sin fecha';
            try {
                // Try parsing as-is first
                let date = new Date(dateString);
                // If invalid, try adding time
                if (isNaN(date.getTime())) {
                    date = new Date(dateString + 'T00:00:00');
                }
                // Still invalid?
                if (isNaN(date.getTime())) {
                    return 'Fecha inválida';
                }
                return date.toLocaleDateString('es-CL', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch (e) {
                return 'Fecha inválida';
            }
        }

        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('es-CL', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function getTourTypeName(type) {
            const names = {
                'regular': 'Regular',
                'private': 'Privado',
                'astrophoto': 'Astrofoto'
            };
            return names[type] || type;
        }

        function getStatusName(status) {
            const names = {
                'confirmed': 'Confirmado',
                'pending': 'Pendiente',
                'cancelled': 'Cancelado',
                'completed': 'Completado'
            };
            return names[status] || status;
        }

        // Logout function
        async function logout() {
            if (confirm('¿Seguro que quieres cerrar sesión?')) {
                await fetch('/api/auth-signout', { method: 'POST' });
                window.location.href = '/admin-login.html';
            }
        }

        // Auto-refresh every 2 minutes
        setInterval(() => {
            loadBookings(currentPage);
        }, 120000);
    </script>
</body>
</html>
